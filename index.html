<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <meta name="author" content="Abraham García Nevado">
    <title>Proyecto Dual Vitaly - Control de inventario videoclub</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <nav>
        <ul>
            <li><a href="#productos">Productos</a></li>
            <li><a href="#añadir-producto">Añadir producto</a></li>
            <li><a href="#editar-producto">Editar producto</a></li>
        </ul>
    </nav>

    <header>
        <h1 class="titulo">Videoclub: RetroVisión - Control de inventario</h1>
    </header>

    <section id="añadir-producto" class="card">
    <h1>Añadir producto</h1>
    <form action="">
        <div>
            <label for="nombre">Nombre del producto</label>
            <span aria-hidden="true"></span>
            <input type="text" id="nombre" name="nombre">
        </div>
        <div>
            <label for="cantidad">Cantidad</label>
            <span aria-hidden="true"></span>
            <input type="number" id="cantidad" name="cantidad">
        </div>
        <div>
            <label for="precio">Precio</label>
            <span aria-hidden="true"></span>
            <input type="number" id="precio" name="precio">
        </div>
        <div>
            <label for="descripcion">Descripción</label>
            <span aria-hidden="true"></span>
            <input type="text" id="descripcion" name="descripcion">
        </div>
        <div>
            <label for="anio">Año lanzamiento</label>
            <span aria-hidden="true"></span>
            <input type="number" id="anio" name="anio" min="1900" max="2026">
        </div>
        <button type="submit">Añadir producto</button>
    </form>
    </section>

    <h1>Productos</h1>

    <table id="productos">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Cantidad</th>
                <th>Precio</th>
                <th>Descripción</th>
                <th>Año</th>
            </tr>
        </thead>
    </table>

    <section id="editar-producto" class="card">
    <h1>Editar producto</h1>
      <form action="">
        <div>
            <label for="producto-editar">Producto</label>
            <span aria-hidden="true"></span>
            <select id="producto-editar" name="producto">
            </select>
        </div>
        <div>
            <label for="edit-cantidad">Cantidad</label>
            <span aria-hidden="true"></span>
            <input type="number" id="edit-cantidad" name="cantidad" min="0">
        </div>
        <div>
            <label for="edit-precio">Precio</label>
            <span aria-hidden="true"></span>
            <input type="number" id="edit-precio" name="precio" min="0" step="0.01">
        </div>
        <div>
            <label for="edit-descripcion">Descripción</label>
            <span aria-hidden="true"></span>
            <input type="text" id="edit-descripcion" name="descripcion">
        </div>
        <div>
            <label for="edit-anio">Año lanzamiento</label>
            <span aria-hidden="true"></span>
            <input type="number" id="edit-anio" name="anio" min="1900" max="2026">
        </div>
        <button type="submit">Guardar cambios</button>
    </form>
    </section>


    
</body>
</html>
